[package]
name = "xylem-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Grammar engine (W3C XML Schema subset and DTD) for the Xylem XML editor"
keywords = ["xml", "xsd", "dtd", "validation", "schema"]
categories = ["parser-implementations"]
readme = "../../README.md"

[dependencies]
xylem-dom = { workspace = true }
regex = "1.12"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
