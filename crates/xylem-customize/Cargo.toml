[package]
name = "xylem-customize"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Xylem doctype packages: native format, registry, and XMAX customization importer"
keywords = ["xml", "xmetal", "xmax", "doctype", "editor"]
categories = ["text-editors"]
readme = "../../README.md"

[dependencies]
xylem-dom = { workspace = true }
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[[bin]]
name = "xylem-import"
path = "src/bin/xylem-import.rs"
