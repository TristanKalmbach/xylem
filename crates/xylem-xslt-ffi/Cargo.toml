[package]
name = "xylem-xslt-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C ABI for Xylem's XSLT engine, for embedding it in other applications (.NET, Java, Python, ...)"
publish = false

[lib]
name = "xylem_xslt"
crate-type = ["cdylib", "rlib"]

[dependencies]
xylem-xslt-engine = { workspace = true }
serde_json = "1"
