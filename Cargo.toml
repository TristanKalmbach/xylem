[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
xylem-dom = { path = "crates/xylem-dom" }
xylem-schema = { path = "crates/xylem-schema" }
xylem-style = { path = "crates/xylem-style" }
xylem-s1000d = { path = "crates/xylem-s1000d" }
xylem-customize = { path = "crates/xylem-customize" }
xylem-xpath = { path = "crates/xylem-xpath" }
xylem-edit = { path = "crates/xylem-edit" }

[profile.release]
opt-level = 3
lto = "thin"
